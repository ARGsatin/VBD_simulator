[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hydrogel-vbd"
version = "0.1.0"
description = "Python MVP framework for VBD-based hydrogel DLP simulation"
requires-python = ">=3.10"
dependencies = ["numpy"]

[tool.setuptools.packages.find]
where = ["src"]
