[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hydrogel-vbd"
version = "0.1.0"
description = "Python MVP framework for VBD-based hydrogel DLP simulation"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "matplotlib",
    "scipy>=1.9",
    "trimesh",
    "rtree",
]

[project.optional-dependencies]
gui = [
    "pyside6",
]
gmsh = [
    "gmsh>=4.11",
]
cpp = [
    # C++ 加速求解器需手动编译（cmake + Eigen + pybind11）
]
dev = [
    "pytest",
]
all = [
    "pyside6",
    "gmsh>=4.11",
    "pytest",
]

[project.scripts]
hydrogel-vbd-demo = "hydrogel_vbd.core.main_loop:main"
hydrogel-vbd-gui = "hydrogel_vbd.gui.main_window:launch_gui"

[tool.setuptools.package-data]
"hydrogel_vbd" = ["gui/*.py"]

[tool.setuptools.packages.find]
where = ["src"]
